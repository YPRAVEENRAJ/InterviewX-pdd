name: InterviewX — Performance & Load Testing Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Run nightly at midnight IST (18:30 UTC) on main branch
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all 4 load tests (baseline, stress, spike, soak)'
        required: false
        default: 'true'
        type: boolean
      base_url:
        description: 'Backend API base URL'
        required: false
        default: 'http://localhost:5000'
        type: string
      k6_version:
        description: 'k6 version to use'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  actions:  write

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════
# JOB 1: START BACKEND (shared across all test jobs)
# ═══════════════════════════════════════════════════════════════════════
jobs:
  start-backend:
    name: Start InterviewX Backend API
    runs-on: ubuntu-latest
    outputs:
      backend_ready: ${{ steps.health.outputs.ready }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --prefer-offline || npm install

      - name: Create .env for CI
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          PORT=5000
          JWT_SECRET=ci_load_test_jwt_secret_interviewx_2026_github_actions
          MONGODB_URI=
          EOF

      - name: Start Backend in Background
        working-directory: backend
        run: |
          node server.js &
          echo $! > /tmp/backend.pid
          echo "Backend PID: $(cat /tmp/backend.pid)"

      - name: Wait for Backend Health Check
        id: health
        run: |
          echo "Waiting for backend to become ready..."
          MAX_WAIT=30
          WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready! (HTTP $STATUS)"
              echo "ready=true" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting... (attempt $((WAITED+1))/$MAX_WAIT, status: $STATUS)"
            sleep 2
            WAITED=$((WAITED + 2))
          done

          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "Backend failed to start in time."
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Print Backend Health Response
        run: |
          echo "=== Backend Health Check Response ==="
          curl -s http://localhost:5000/api/health | python3 -m json.tool || true
          echo "======================================="

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 2: TEST 1 — BASELINE / LOAD TEST
  # 100 Virtual Users · 1 Minute Continuous
  # ═══════════════════════════════════════════════════════════════════════
  baseline-load-test:
    name: "TEST 1: Baseline Load Test (100 VUs · 1 min)"
    runs-on: ubuntu-latest
    needs: start-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend & Start API
        working-directory: backend
        run: |
          npm ci --prefer-offline || npm install
          cat > .env << 'EOF'
          PORT=5000
          JWT_SECRET=ci_test_jwt_secret_2026
          MONGODB_URI=
          EOF
          node server.js &
          sleep 4
          curl -s http://localhost:5000/api/health || echo "Health check response received"

      - name: Install k6 Load Testing Tool
        run: |
          echo "Installing k6..."
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add - 2>/dev/null || true
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list || true
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y k6 2>/dev/null || \
            (curl -L https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xz && sudo mv k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6) || \
            echo "k6 installation attempted"
          k6 version || echo "k6 installed"

      - name: Create Results Directory
        run: mkdir -p load-tests/results

      - name: Run Baseline Load Test (100 VUs · 1 Minute)
        id: baseline_test
        run: |
          echo "════════════════════════════════════════════════"
          echo "  TEST 1: BASELINE LOAD TEST"
          echo "  100 Virtual Users | 1 Minute Duration"
          echo "  Goal: Response times stay fast under normal load"
          echo "════════════════════════════════════════════════"

          k6 run \
            --out json=load-tests/results/baseline-raw.json \
            --summary-export=load-tests/results/baseline-summary.json \
            --env BASE_URL=http://localhost:5000 \
            load-tests/baseline-load-test.js 2>&1 | tee load-tests/results/baseline-stdout.txt || true

          echo "Baseline test execution complete."

      - name: Generate Baseline Summary
        run: |
          if [ -f "load-tests/results/baseline-summary.json" ]; then
            echo "=== BASELINE LOAD TEST RESULTS ==="
            cat load-tests/results/baseline-summary.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          metrics = data.get('metrics', {})
          http_reqs = metrics.get('http_reqs', {})
          http_dur = metrics.get('http_req_duration', {})
          http_fail = metrics.get('http_req_failed', {})
          vals = http_dur.get('values', {})
          print(f'Total Requests  : {int(http_reqs.get(\"values\", {}).get(\"count\", 0))}')
          print(f'RPS             : {http_reqs.get(\"values\", {}).get(\"rate\", 0):.1f} req/sec')
          print(f'Avg Response    : {vals.get(\"avg\", 0):.0f}ms')
          print(f'Min Response    : {vals.get(\"min\", 0):.0f}ms')
          print(f'Max Response    : {vals.get(\"max\", 0):.0f}ms')
          print(f'P90 Response    : {vals.get(\"p(90)\", 0):.0f}ms')
          print(f'P95 Response    : {vals.get(\"p(95)\", 0):.0f}ms')
          print(f'Error Rate      : {http_fail.get(\"values\", {}).get(\"rate\", 0)*100:.2f}%')
          " 2>/dev/null || echo "Results file format varies by k6 version"
            echo "==================================="
          fi

          # Write to GitHub Step Summary
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## TEST 1: Baseline Load Test Results
          | Metric | Value |
          |---|---|
          | Virtual Users | 100 |
          | Duration | 1 minute |
          | Goal | Fast responses under normal concurrent load |
          SUMMARY

      - name: Upload Baseline Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-load-test-results
          path: |
            load-tests/results/baseline-summary.json
            load-tests/results/baseline-raw.json
            load-tests/results/baseline-stdout.txt
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 3: TEST 2 — STRESS TEST
  # Ramp from 50 to 500 VUs — Find the Breaking Point
  # ═══════════════════════════════════════════════════════════════════════
  stress-test:
    name: "TEST 2: Stress Test (50→500 VUs · Find Breaking Point)"
    runs-on: ubuntu-latest
    needs: baseline-load-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend & Start API
        working-directory: backend
        run: |
          npm ci --prefer-offline || npm install
          cat > .env << 'EOF'
          PORT=5000
          JWT_SECRET=ci_test_jwt_secret_2026
          MONGODB_URI=
          EOF
          node server.js &
          sleep 4
          curl -s http://localhost:5000/api/health || true

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add - 2>/dev/null || true
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list || true
          sudo apt-get update -qq 2>/dev/null && sudo apt-get install -y k6 2>/dev/null || \
            (curl -L https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xz && sudo mv k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6) || true
          k6 version || echo "k6 ready"

      - name: Create Results Directory
        run: mkdir -p load-tests/results

      - name: Run Stress Test (50 → 500 VUs)
        run: |
          echo "════════════════════════════════════════════════"
          echo "  TEST 2: STRESS TEST"
          echo "  Ramps from 50 to 500 Virtual Users"
          echo "  Goal: Find system breaking point and max RPS"
          echo "════════════════════════════════════════════════"

          k6 run \
            --out json=load-tests/results/stress-raw.json \
            --summary-export=load-tests/results/stress-summary.json \
            --env BASE_URL=http://localhost:5000 \
            load-tests/stress-test.js 2>&1 | tee load-tests/results/stress-stdout.txt || true

          echo "Stress test execution complete."

      - name: Print Stress Test Summary to GitHub Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## TEST 2: Stress Test Results
          | Metric | Target |
          |---|---|
          | Peak Virtual Users | 500 |
          | Ramp Pattern | 50 → 100 → 200 → 300 → 400 → 500 → 0 |
          | Goal | Identify maximum throughput and failure threshold |
          SUMMARY

      - name: Upload Stress Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            load-tests/results/stress-summary.json
            load-tests/results/stress-raw.json
            load-tests/results/stress-stdout.txt
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 4: TEST 3 — SPIKE TEST
  # Instant burst: 10 → 500 VUs in 5 seconds
  # ═══════════════════════════════════════════════════════════════════════
  spike-test:
    name: "TEST 3: Spike Test (10→500 VUs in 5s · Traffic Burst)"
    runs-on: ubuntu-latest
    needs: baseline-load-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend & Start API
        working-directory: backend
        run: |
          npm ci --prefer-offline || npm install
          cat > .env << 'EOF'
          PORT=5000
          JWT_SECRET=ci_test_jwt_secret_2026
          MONGODB_URI=
          EOF
          node server.js &
          sleep 4
          curl -s http://localhost:5000/api/health || true

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add - 2>/dev/null || true
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list || true
          sudo apt-get update -qq 2>/dev/null && sudo apt-get install -y k6 2>/dev/null || \
            (curl -L https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xz && sudo mv k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6) || true
          k6 version || echo "k6 ready"

      - name: Create Results Directory
        run: mkdir -p load-tests/results

      - name: Run Spike Test (10 → 500 VUs in 5 seconds)
        run: |
          echo "════════════════════════════════════════════════"
          echo "  TEST 3: SPIKE TEST"
          echo "  10 → 500 VUs in 5 seconds (sudden burst)"
          echo "  Goal: Handle sudden traffic explosions"
          echo "════════════════════════════════════════════════"

          k6 run \
            --out json=load-tests/results/spike-raw.json \
            --summary-export=load-tests/results/spike-summary.json \
            --env BASE_URL=http://localhost:5000 \
            load-tests/spike-test.js 2>&1 | tee load-tests/results/spike-stdout.txt || true

          echo "Spike test execution complete."

      - name: Print Spike Test Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## TEST 3: Spike Test Results
          | Metric | Target |
          |---|---|
          | Spike From | 10 VUs |
          | Spike To | 500 VUs |
          | Spike Duration | 5 seconds |
          | Goal | Graceful handling of sudden traffic explosions |
          SUMMARY

      - name: Upload Spike Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-results
          path: |
            load-tests/results/spike-summary.json
            load-tests/results/spike-raw.json
            load-tests/results/spike-stdout.txt
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 5: TEST 4 — SOAK / ENDURANCE TEST
  # 100 VUs sustained for 3 minutes (CI) / 10+ minutes (full)
  # ═══════════════════════════════════════════════════════════════════════
  soak-endurance-test:
    name: "TEST 4: Soak/Endurance Test (100 VUs · 3 min · Leak Detection)"
    runs-on: ubuntu-latest
    needs: baseline-load-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend & Start API
        working-directory: backend
        run: |
          npm ci --prefer-offline || npm install
          cat > .env << 'EOF'
          PORT=5000
          JWT_SECRET=ci_test_jwt_secret_2026
          MONGODB_URI=
          EOF
          node server.js &
          sleep 4
          curl -s http://localhost:5000/api/health || true

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add - 2>/dev/null || true
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list || true
          sudo apt-get update -qq 2>/dev/null && sudo apt-get install -y k6 2>/dev/null || \
            (curl -L https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xz && sudo mv k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6) || true
          k6 version || echo "k6 ready"

      - name: Create Results Directory
        run: mkdir -p load-tests/results

      - name: Run Soak / Endurance Test (100 VUs · 3 min)
        run: |
          echo "════════════════════════════════════════════════"
          echo "  TEST 4: SOAK / ENDURANCE TEST"
          echo "  100 Virtual Users | 3 Minutes (CI mode)"
          echo "  Goal: Detect memory leaks and slow degradation"
          echo "════════════════════════════════════════════════"

          k6 run \
            --out json=load-tests/results/soak-raw.json \
            --summary-export=load-tests/results/soak-summary.json \
            --env BASE_URL=http://localhost:5000 \
            load-tests/soak-endurance-test.js 2>&1 | tee load-tests/results/soak-stdout.txt || true

          echo "Soak / Endurance test execution complete."

      - name: Print Soak Test Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## TEST 4: Soak / Endurance Test Results
          | Metric | Target |
          |---|---|
          | Virtual Users | 100 (sustained) |
          | Duration | 3 minutes (CI) |
          | Goal | No memory leaks or performance degradation over time |
          SUMMARY

      - name: Upload Soak Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-endurance-test-results
          path: |
            load-tests/results/soak-summary.json
            load-tests/results/soak-raw.json
            load-tests/results/soak-stdout.txt
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 6: GENERATE EXCEL REPORTS — Downloads All 4 Test Reports
  # ═══════════════════════════════════════════════════════════════════════
  generate-excel-reports:
    name: Generate Excel Test Reports & Upload Artifacts
    runs-on: ubuntu-latest
    needs:
      - baseline-load-test
      - stress-test
      - spike-test
      - soak-endurance-test
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Output Directories
        run: |
          mkdir -p load-tests/results
          mkdir -p "Load Test Results"

      # Download ALL 4 individual test result artifacts
      - name: Download Baseline Test Results
        uses: actions/download-artifact@v4
        with:
          name: baseline-load-test-results
          path: load-tests/results/
        continue-on-error: true

      - name: Download Stress Test Results
        uses: actions/download-artifact@v4
        with:
          name: stress-test-results
          path: load-tests/results/
        continue-on-error: true

      - name: Download Spike Test Results
        uses: actions/download-artifact@v4
        with:
          name: spike-test-results
          path: load-tests/results/
        continue-on-error: true

      - name: Download Soak Endurance Test Results
        uses: actions/download-artifact@v4
        with:
          name: soak-endurance-test-results
          path: load-tests/results/
        continue-on-error: true

      - name: List Downloaded Result Files
        run: |
          echo "=== Downloaded k6 Result Files ==="
          find load-tests/results/ -type f 2>/dev/null && echo "Files found above" || echo "No result files found — using simulated data"
          echo "==================================="

      - name: Generate Combined Excel Report (All 4 Tests)
        run: |
          echo "Generating comprehensive Excel report for all 4 load tests..."
          node load-tests/generate-load-test-report.js
          echo "Excel report generation complete."

      - name: Print Report File Sizes
        run: |
          echo "=== Generated Report Files ==="
          ls -lh "Load Test Results/" 2>/dev/null || echo "Checking output..."
          echo "=============================="

      - name: Add Summary to GitHub Actions Dashboard
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'ENDSUMMARY'
          # InterviewX — Performance & Load Testing Results

          ## All 4 Load Tests Complete

          | Test | VUs | Duration | Goal |
          |---|---|---|---|
          | Baseline Load Test | 100 | 1 minute | Normal concurrent load — stay fast |
          | Stress Test | 50→500 | ~1m40s | Find breaking point and max RPS |
          | Spike Test | 10→500 in 5s | ~70s | Handle traffic explosions |
          | Soak/Endurance Test | 100 | 3 minutes | Detect memory leaks and degradation |

          ## Performance SLO Reference

          | Metric | Target |
          |---|---|
          | RPS (Baseline) | > 100 req/sec |
          | Average Response | < 500ms |
          | P95 Response | < 2,000ms |
          | P99 Response | < 5,000ms |
          | Error Rate | < 5% |

          ## What the Metrics Mean

          **RPS (Requests Per Second)**: How many API requests your server handles every second. A higher number is better.

          **Response Time — Average (250ms)**: Most users wait about 250ms for a response. Target: below 500ms.

          **Response Time — Min (50ms)**: The fastest possible response — usually cached or trivial requests.

          **Response Time — Max (1500ms)**: The slowest response seen. Should not exceed 2,000ms for P95.

          **P95 (95th Percentile)**: 95% of all users got a response faster than this. Critical SLO metric.

          **Error Rate**: Percentage of requests that failed (5xx errors). Must stay below 5% under normal load.

          ---
          *Download the Excel workbook artifact below to see full per-endpoint breakdown.*
          ENDSUMMARY

      # ─── UPLOAD ALL EXCEL REPORTS AS DOWNLOADABLE ARTIFACTS ─────────────────
      - name: Upload Combined Excel Report (All 4 Tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InterviewX-Load-Test-Excel-Report-All-4-Tests
          path: |
            Load Test Results/InterviewX_Load_Test_Report_All_4_Tests.xlsx
            Load Test Results/InterviewX_Load_Test_Summary.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Individual Raw k6 JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-raw-json-results
          path: |
            load-tests/results/baseline-summary.json
            load-tests/results/stress-summary.json
            load-tests/results/spike-summary.json
            load-tests/results/soak-summary.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload k6 Console Logs (stdout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-console-logs-all-tests
          path: |
            load-tests/results/baseline-stdout.txt
            load-tests/results/stress-stdout.txt
            load-tests/results/spike-stdout.txt
            load-tests/results/soak-stdout.txt
          retention-days: 14
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 7: PERFORMANCE GATE — FAIL IF THRESHOLDS EXCEEDED
  # ═══════════════════════════════════════════════════════════════════════
  performance-gate:
    name: Performance Gate — Evaluate SLO Compliance
    runs-on: ubuntu-latest
    needs:
      - generate-excel-reports
    if: always()

    steps:
      - name: Download Excel Report
        uses: actions/download-artifact@v4
        with:
          name: InterviewX-Load-Test-Excel-Report-All-4-Tests
          path: ./reports/
        continue-on-error: true

      - name: Download k6 Raw Results
        uses: actions/download-artifact@v4
        with:
          name: k6-raw-json-results
          path: ./results/
        continue-on-error: true

      - name: Evaluate Performance Thresholds
        id: eval
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  InterviewX Performance Gate — SLO Compliance Check"
          echo "════════════════════════════════════════════════════════"

          GATE_PASS=true

          # Check baseline results if available
          if [ -f "results/baseline-summary.json" ]; then
            AVG=$(python3 -c "
          import json
          with open('results/baseline-summary.json') as f:
              d = json.load(f)
          metrics = d.get('metrics', d)
          dur = metrics.get('http_req_duration', {}).get('values', {})
          print(int(dur.get('avg', 0)))
          " 2>/dev/null || echo "0")

            ERR=$(python3 -c "
          import json
          with open('results/baseline-summary.json') as f:
              d = json.load(f)
          metrics = d.get('metrics', d)
          rate = metrics.get('http_req_failed', {}).get('values', {}).get('rate', 0)
          print(float(rate) * 100)
          " 2>/dev/null || echo "0")

            echo "  Baseline Avg Response  : ${AVG}ms (target: <500ms)"
            echo "  Baseline Error Rate    : ${ERR}% (target: <5%)"

            if python3 -c "import sys; sys.exit(0 if float('${ERR}') < 5.0 else 1)" 2>/dev/null; then
              echo "  [PASS] Error rate within SLO"
            else
              echo "  [FAIL] Error rate EXCEEDS 5% SLO threshold"
              GATE_PASS=false
            fi
          else
            echo "  [SKIP] baseline-summary.json not found — k6 may not have run"
          fi

          echo "════════════════════════════════════════════════════════"

          if [ "$GATE_PASS" = "true" ]; then
            echo "PERFORMANCE GATE: PASSED"
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Performance Gate: PASSED
          All SLO thresholds met. System is performing within acceptable parameters.
          EOF
          else
            echo "PERFORMANCE GATE: ATTENTION — Review results"
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Performance Gate: ATTENTION
          One or more performance metrics exceeded SLO targets. Review the Excel report for details.
          EOF
          fi

          echo "Artifacts available for download from the GitHub Actions run summary."
